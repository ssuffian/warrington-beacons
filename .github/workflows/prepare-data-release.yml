name: Prepare trail data release

on:
  workflow_dispatch:
    inputs:
      api_version:
        description: API major versions to update from the same Sheet snapshot
        required: true
        default: all
        type: choice
        options:
          - all
          - v3
          - v2

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test master Sheet validation
        run: python3 -m unittest discover -s scripts -p 'test_master_sheet.py'
      - name: Install contract validator
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-api-contract.txt
      - name: Generate and validate the release candidates
        env:
          API_VERSIONS: ${{ inputs.api_version == 'all' && 'v2 v3' || inputs.api_version }}
        run: |
          python3 scripts/fetch_master_sheet.py 1Pl3uBhqcJbEpxifa4ko2-RpFK4rOT44P /tmp/warrington-master-csv
          # Every version must validate before any is staged, so one release never splits.
          for version in $API_VERSIONS; do
            python3 scripts/master_sheet.py /tmp/warrington-master-csv --kml server/talking-trails.kml --api-version "$version" --output-dir "/tmp/warrington-master-validation/$version"
          done
      - name: Stage the selected API versions
        env:
          API_VERSIONS: ${{ inputs.api_version == 'all' && 'v2 v3' || inputs.api_version }}
        run: |
          for version in $API_VERSIONS; do
            test -d "server/api/$version"
            cp "/tmp/warrington-master-validation/$version/candidate.json" "server/api/$version/trails.json"
            cp server/talking-trails.kml "server/api/$version/talking-trails.kml"
            python3 scripts/validate_api_contract.py "server/api/$version/schema.json" "server/api/$version/trails.json"
          done
          python3 scripts/build_image_library.py
      - name: Open a review pull request
        env:
          GH_TOKEN: ${{ github.token }}
          API_VERSION: ${{ inputs.api_version }}
        run: |
          if [ -z "$(git status --porcelain -- server)" ]; then
            echo "No published data changed."
            exit 0
          fi
          branch="data-release-${API_VERSION}-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add server
          git commit -m "Prepare $API_VERSION trail data release"
          git push origin "$branch"
          cat > /tmp/data-release-pr.md <<EOF
          This pull request contains a validated $API_VERSION data snapshot generated from the master spreadsheet and the committed KML.

          Review the JSON and KML changes before merging. Merging publishes the committed snapshot; later spreadsheet edits will not change the live server until another release pull request is generated and merged.
          EOF
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "Prepare $API_VERSION trail data release" \
            --body-file /tmp/data-release-pr.md
